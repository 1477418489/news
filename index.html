<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日读世界 · 60s 全量资讯</title>
<style>
  :root {
    --bg:#0e1014; --bg-side:#14171d; --card:rgba(255,255,255,.055); --card-2:rgba(255,255,255,.03);
    --card-border:rgba(255,255,255,.09); --text:#e8eaed; --text-dim:#9aa0a6; --text-faint:#676d75;
    --accent:#4f9dff; --accent-2:#a679ff; --gold:#ffc14d; --warn:#ff6b6b; --green:#4ade80;
    --shadow:0 8px 30px rgba(0,0,0,.3); --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

  .app{display:flex;min-height:100vh}
  .sidebar{width:210px;flex:none;background:var(--bg-side);border-right:1px solid var(--card-border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{padding:22px 20px 14px}
  .side-brand h1{font-size:20px;font-weight:800;letter-spacing:-.4px;
    background:linear-gradient(120deg,#fff,#9cc4ff 60%,#c6a8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .side-brand p{color:var(--text-faint);font-size:11.5px;margin-top:3px}
  .side-date{padding:0 20px 14px;border-bottom:1px solid var(--card-border);margin-bottom:6px}
  .side-date .d{font-size:15px;font-weight:700}
  .side-date .w{color:var(--text-dim);font-size:12px}
  .nav{list-style:none;padding:4px 10px;flex:1}
  .nav li{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;
    color:var(--text-dim);font-size:14px;transition:.18s;margin-bottom:2px;user-select:none}
  .nav li .ic{font-size:16px;width:20px;text-align:center;flex:none}
  .nav li:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .nav li.active{background:linear-gradient(135deg,rgba(79,157,255,.2),rgba(166,121,255,.18));color:#fff;font-weight:600}
  .side-foot{padding:14px 20px 18px;font-size:11px;color:var(--text-faint)}
  .side-foot a{color:var(--text-dim)} .side-foot a:hover{color:var(--accent)}

  .main{flex:1;min-width:0;overflow-x:hidden}
  .main-inner{max-width:1180px;margin:0 auto;padding:26px 26px 70px}
  .view-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .view-head h2{font-size:22px;font-weight:800}
  .view-head .refresh{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--card-border);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:.2s}
  .view-head .refresh:hover{background:rgba(255,255,255,.11)}
  .view-head .refresh.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .view-desc{color:var(--text-faint);font-size:13px;margin-bottom:18px}

  .subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .subtab{font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--text-dim);
    background:var(--card);border:1px solid var(--card-border);transition:.2s}
  .subtab:hover{color:var(--text)}
  .subtab.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}

  .grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr);align-items:start}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);overflow:hidden;animation:rise .35s ease both}
  .card:hover{border-color:rgba(255,255,255,.16)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}
  .col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}
  .col-9{grid-column:span 9}.col-12{grid-column:span 12}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .card-head .ico{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px;
    background:linear-gradient(135deg,rgba(79,157,255,.22),rgba(166,121,255,.22))}
  .card-head h3{font-size:15px;font-weight:700}
  .card-head .sub{color:var(--text-faint);font-size:12px;margin-left:auto;text-align:right}

  .moyu-info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{font-size:12px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--card-border)}
  .chip.hot{color:var(--gold);border-color:rgba(255,193,77,.3);background:rgba(255,193,77,.08)}
  .prog{margin-bottom:11px}.prog:last-child{margin-bottom:0}
  .prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:5px}
  .prog .lbl b{color:var(--text)}
  .prog .track{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
  .prog .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

  .news-list{counter-reset:n;list-style:none}
  .news-list li{counter-increment:n;position:relative;padding:8px 0 8px 32px;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.06)}
  .news-list li:last-child{border-bottom:none}
  .news-list li::before{content:counter(n);position:absolute;left:0;top:8px;width:21px;height:21px;border-radius:7px;
    font-size:11px;font-weight:700;display:grid;place-items:center;color:#cfe0ff;background:rgba(79,157,255,.14)}
  .tip{margin-top:12px;padding:12px 14px;border-radius:11px;
    background:linear-gradient(135deg,rgba(166,121,255,.12),rgba(79,157,255,.07));
    border-left:3px solid var(--accent-2);font-size:13px;color:#d6cbff}

  .bing{padding:0;position:relative;min-height:300px}
  .bing .img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.05);transition:transform 8s ease}
  .bing:hover .img{transform:scale(1.12)}
  .bing .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.15) 55%,transparent)}
  .bing .txt{position:absolute;left:0;right:0;bottom:0;padding:20px}
  .bing .txt .tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);margin-bottom:8px}
  .bing .txt h3{font-size:18px;font-weight:700}
  .bing .txt p{font-size:12.5px;color:#cfd3d8;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .quote{font-size:16px;line-height:1.85;font-weight:500;display:flex;align-items:flex-start;min-height:56px}
  .quote .mark{font-size:40px;color:var(--accent-2);opacity:.35;font-family:Georgia,serif;margin-right:6px;line-height:.8;flex:none}
  .quote.small{font-size:13.5px;font-weight:400;color:var(--text-dim);line-height:1.8}
  .quote .en{display:block;color:var(--text-faint);font-size:13px;margin-top:6px;font-weight:400}
  .luck{text-align:center;padding:6px 0}
  .luck .rank{font-size:28px;font-weight:800;background:linear-gradient(120deg,var(--gold),#ff8f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .luck .tip2{color:var(--text-dim);font-size:13px;margin-top:10px}

  .hot-list,.plain-list,.hist-list,.film-list,.kv-list{list-style:none}
  .hot-list li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13.5px}
  .hot-list li:last-child{border-bottom:none}
  .hot-list a{flex:1;transition:color .2s;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .hot-list a:hover{color:var(--accent)}
  .hot-rank{flex:none;width:18px;text-align:center;font-weight:700;font-size:12px;color:var(--text-faint)}
  .hot-list li:nth-child(1) .hot-rank{color:#ff6b6b}
  .hot-list li:nth-child(2) .hot-rank{color:#ffa94d}
  .hot-list li:nth-child(3) .hot-rank{color:#ffd43b}
  .hot-val{flex:none;font-size:10.5px;color:var(--text-faint);background:rgba(255,255,255,.05);padding:2px 7px;border-radius:6px}

  .hist-list li,.plain-list li{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .hist-list li:last-child,.plain-list li:last-child{border-bottom:none}
  .hist-year{font-weight:700;color:var(--accent);font-size:13px;margin-right:8px}
  .hist-title{font-size:13.5px}
  .plain-list a{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
  .plain-list a:hover{color:var(--accent)}
  .plain-list .meta{font-size:11px;color:var(--text-faint);margin-top:3px}

  .price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .price-item{background:var(--card-2);border:1px solid var(--card-border);border-radius:11px;padding:11px 13px}
  .price-item .k{font-size:11.5px;color:var(--text-dim)}
  .price-item .v{font-size:17px;font-weight:700;margin-top:2px}
  .price-item .n{color:var(--text-faint);font-size:10.5px;margin-top:3px}

  .poster-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
  .poster{display:block;width:100%;text-align:left;color:inherit;background:none;border:0;padding:0;cursor:pointer;font:inherit}
  .poster .pic{aspect-ratio:2/3;border-radius:10px;background-size:cover;background-position:center;
    background-color:rgba(255,255,255,.05);position:relative;overflow:hidden;transition:transform .25s}
  .poster:hover .pic{transform:translateY(-4px)}
  .poster .rating{position:absolute;top:6px;right:6px;font-size:11px;font-weight:700;color:#ffd43b;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:6px}
  .poster .free{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;color:#fff;background:var(--green);padding:2px 7px;border-radius:6px}
  .poster .t{font-size:12.5px;margin-top:7px;font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .poster .s{font-size:11px;color:var(--text-faint);margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  .box-total{display:flex;gap:22px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,.08);flex-wrap:wrap}
  .box-total .b .n{font-size:11px;color:var(--text-dim)}
  .box-total .b .v{font-size:18px;font-weight:700;margin-top:2px}
  .film-list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .film-list li:last-child{border-bottom:none}
  .film-list .nm{flex:1;font-size:13.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .film-list .rel{font-size:11px;color:var(--text-faint);font-weight:400}
  .film-list .bx{text-align:right;flex:none}
  .film-list .bx .a{font-size:14px;font-weight:700;color:var(--gold)}
  .film-list .bx .p{font-size:11px;color:var(--text-faint)}

  .tool-form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tool-form input,.tool-form select,.tool-form textarea{
    background:var(--card-2);border:1px solid var(--card-border);border-radius:10px;color:var(--text);
    padding:10px 14px;font-size:14px;flex:1;min-width:140px;outline:none}
  .tool-form textarea{min-height:80px;resize:vertical;font-family:inherit}
  .tool-form input:focus,.tool-form select:focus,.tool-form textarea:focus{border-color:var(--accent)}
  .tool-form button{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;
    padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;flex:none}
  .tool-form button:hover{opacity:.92}
  .kv-list li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13.5px;align-items:flex-start}
  .kv-list li:last-child{border-bottom:none}
  .kv-list .k{color:var(--text-dim);flex:none;width:110px}
  .kv-list .v{flex:1;word-break:break-all;font-family:"SF Mono",Consolas,monospace;font-size:12.5px}
  .copy{cursor:pointer;color:var(--accent);font-size:11px;flex:none}
  .qr-result{text-align:center;padding:10px}
  .qr-result img{max-width:220px;border-radius:12px;background:#fff;padding:10px}
  .swatch-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
  .swatch{border-radius:10px;overflow:hidden;border:1px solid var(--card-border)}
  .swatch .c{height:60px}
  .swatch .lbl2{font-size:11px;padding:6px 8px;background:var(--card-2)}
  .swatch .lbl2 .nm2{color:var(--text-dim)}
  .swatch .lbl2 .hx{font-family:monospace}
  .strength-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0}
  .strength-bar .f{height:100%;border-radius:999px;transition:width .5s}

  .wx-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .wx-temp{font-size:48px;font-weight:800;line-height:1}
  .wx-meta{color:var(--text-dim);font-size:13px}
  .wx-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
  .wx-day{background:var(--card-2);border:1px solid var(--card-border);border-radius:11px;padding:12px;text-align:center}
  .wx-day .dt{font-size:12px;color:var(--text-dim)}
  .wx-day .t{font-size:15px;font-weight:700;margin:6px 0}
  .wx-day .c{font-size:12px;color:var(--text-faint)}
  .lyric-box{white-space:pre-wrap;font-size:13.5px;line-height:1.9;color:var(--text-dim);max-height:420px;overflow:auto}

  .skeleton{color:var(--text-faint);font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .err{color:var(--warn);font-size:13px}
  .empty{color:var(--text-faint);font-size:13px;padding:10px 0}
  .note{font-size:12px;color:var(--text-faint);margin-top:8px}

  /* 友好错误卡 */
  .err-card{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:12px;
    background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.28)}
  .err-ico{font-size:22px;line-height:1;flex:none}
  .err-body{flex:1;min-width:0}
  .err-title{font-size:15px;font-weight:700;color:#ffb4b4;margin-bottom:4px}
  .err-reason{font-size:13px;color:var(--text-dim);line-height:1.55}
  .err-path{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:"SF Mono",Consolas,monospace;word-break:break-all}
  .err-toggle{margin-top:10px;background:transparent;border:1px solid rgba(255,107,107,.35);color:#ffb4b4;
    border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer}
  .err-toggle:hover{background:rgba(255,107,107,.12)}
  .err-detail{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.35);
    color:var(--text-faint);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;
    max-height:180px;overflow:auto;font-family:"SF Mono",Consolas,monospace}

  /* RSS */
  .rss-item{padding:14px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  .rss-item:last-child{border-bottom:none}
  .rss-item .rt{font-size:15px;font-weight:650;transition:color .2s}
  .rss-item a:hover .rt{color:var(--accent)}
  .rss-item .rm{font-size:12px;color:var(--text-faint);margin-top:4px}
  .rss-item .rs{font-size:13px;color:var(--text-dim);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6}
  .rss-manage{display:grid;gap:12px}
  .rss-row{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card-2);
    border:1px solid var(--card-border);border-radius:11px;flex-wrap:wrap}
  .rss-row .nm{font-weight:650;flex:1;min-width:120px}
  .rss-row .url{font-size:12px;color:var(--text-faint);font-family:monospace;word-break:break-all;flex:2;min-width:180px}
  .rss-row .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(79,157,255,.15);color:#9cc4ff}
  .rss-row .tag.custom{background:rgba(166,121,255,.15);color:#d0b8ff}
  .btn-ghost{background:var(--card);border:1px solid var(--card-border);color:var(--text);
    padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer}
  .btn-ghost:hover{border-color:rgba(255,255,255,.22)}
  .btn-danger{border-color:rgba(255,107,107,.4);color:#ffb4b4}

  .menu-toggle{display:none}
  @media(max-width:860px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:sticky;top:0;z-index:20;border-right:none;border-bottom:1px solid var(--card-border)}
    .side-brand{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
    .side-brand .txt2{flex:1}
    .side-date{display:none}
    .nav{display:flex;overflow-x:auto;padding:6px 10px 10px;gap:6px}
    .nav.collapsed{display:none}
    .nav li{white-space:nowrap;margin-bottom:0;padding:8px 13px}
    .side-foot{display:none}
    .menu-toggle{display:inline-flex;background:var(--card);border:1px solid var(--card-border);color:var(--text);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:18px}
    .col-3,.col-4,.col-5,.col-6,.col-7,.col-8,.col-9{grid-column:span 12}
    .main-inner{padding:20px 16px 60px}
  }
  @media(min-width:861px) and (max-width:1080px){.col-3,.col-4{grid-column:span 6}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="txt2"><h1>今日读世界</h1><p>60s 全量资讯平台</p></div>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
    <div class="side-date"><div class="d" id="sideDate">--</div><div class="w" id="sideWeek">加载中…</div></div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      数据来源 <a href="https://github.com/vikiboss/60s" target="_blank" rel="noopener noreferrer">60s API</a><br>
      文档 <a href="https://docs.60s-api.viki.moe" target="_blank" rel="noopener noreferrer">docs.60s-api</a>
    </div>
  </aside>
  <main class="main">
    <div class="main-inner">
      <div class="view-head">
        <h2 id="viewTitle">今日概览</h2>
        <button class="refresh" id="btnRefresh" title="刷新当前页">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          刷新
        </button>
      </div>
      <div class="view-desc" id="viewDesc"></div>
      <div id="subtabsWrap"></div>
      <div id="viewBody"></div>
    </div>
  </main>
</div>
<script>
const API = "https://60.newday.cc.cd/v2";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/** 仅允许 http(s) 与相对路径，拦截 javascript:/data: 等 */
function safeURL(u) {
  if (u == null || u === "") return "";
  const s = String(u).trim();
  if (!s || s === "#") return "";
  // 协议相对 //example.com
  if (s.startsWith("//")) return "https:" + s;
  // 相对路径
  if (s.startsWith("/") && !s.startsWith("//")) return s;
  try {
    const parsed = new URL(s, location.href);
    if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
  } catch {}

/** 把接口/网络原始错误整理成可读结构（剥离 HTML 源码） */
function parseApiError(err, path) {
  const raw = String(err?.message ?? err ?? "未知错误");
  const apiPath = path || err?.apiPath || "";
  const httpMatch = raw.match(/status:\s*(\d+)/i) || raw.match(/HTTP\s+(\d+)/i);
  const httpStatus = err?.httpStatus || (httpMatch ? httpMatch[1] : null);
  const apiCode = err?.apiCode;

  // 去掉 message 中夹带的 HTML 错误页
  let cleaned = raw
    .replace(/response:\s*<[\s\S]*/i, "response: [上游返回 HTML 错误页，已省略]")
    .replace(/<!doctype[\s\S]*/i, "[HTML 文档，已省略]")
    .replace(/<html[\s\S]*/i, "[HTML 文档，已省略]")
    .replace(/<[^>]+>/g, " ")
    .replace(/&[a-z]+;/gi, " ")
    .replace(/\s+/g, " ")
    .trim();

  let friendly = "数据加载失败";
  let reason = cleaned.slice(0, 160) || "未知原因";

  if (/Failed to fetch|NetworkError|Load failed|网络/i.test(raw)) {
    friendly = "网络请求失败";
    reason = "无法连接到服务，可能是跨域（CORS）限制、断网或接口不可达。";
  } else if (httpStatus) {
    friendly = `上游服务异常（HTTP ${httpStatus}）`;
    reason = "源站没有返回正常数据，而是错误页。该订阅源/接口当前可能不可用。";
  } else if (apiCode && apiCode >= 500) {
    friendly = `服务端错误（code ${apiCode}）`;
    reason = cleaned.replace(/^服务器出错了[.…\s]*/i, "") || "接口内部出错，请稍后再试。";
  } else if (apiCode && apiCode >= 400) {
    friendly = `请求无效（code ${apiCode}）`;
    reason = cleaned;
  } else if (/数据异常|暂无/.test(raw)) {
    friendly = "暂无可用数据";
    reason = "接口响应成功，但内容为空或异常。";
  } else if (/未找到|404|not found/i.test(raw)) {
    friendly = "未找到内容";
    reason = cleaned;
  } else if (/参数/.test(raw)) {
    friendly = "请求参数有误";
    reason = cleaned;
  } else if (/非 JSON|解析失败|Unexpected token/i.test(raw)) {
    friendly = "响应格式异常";
    reason = "期望 JSON，但收到了无法解析的内容（可能是 HTML 错误页）。";
  } else if (/CORS/i.test(raw)) {
    friendly = "跨域被拦截";
    reason = "浏览器因 CORS 策略阻止了该请求。";
  }

  // 技术详情：截断 + 去掉 HTML
  let detail = raw
    .replace(/response:\s*<[\s\S]*/i, "response: [上游 HTML 错误页已省略]")
    .replace(/<!doctype[\s\S]*/i, "[HTML 已省略]");
  if (detail.length > 600) detail = detail.slice(0, 600) + "…";

  return { friendly, reason, detail, path: apiPath, httpStatus, apiCode };
}
function fail(el, err, path) {
  if (!el) return;
  const info = (err && err.friendly) ? err : parseApiError(err, path);
  const id = "err-" + Math.random().toString(36).slice(2, 9);
  el.innerHTML = `<div class="err-card">
    <div class="err-ico">⚠️</div>
    <div class="err-body">
      <div class="err-title">${esc(info.friendly)}</div>
      <div class="err-reason">${esc(info.reason)}</div>
      ${info.path ? `<div class="err-path">${esc(info.path)}</div>` : ""}
      <button type="button" class="err-toggle" data-target="${id}">查看技术详情</button>
      <pre class="err-detail" id="${id}" hidden>${esc(info.detail || "")}</pre>
    </div>
  </div>`;
  el.querySelector(".err-toggle")?.addEventListener("click", (ev) => {
    const btn = ev.currentTarget;
    const t = document.getElementById(btn.dataset.target);
    if (!t) return;
    const open = t.hasAttribute("hidden");
    if (open) { t.removeAttribute("hidden"); btn.textContent = "收起技术详情"; }
    else { t.setAttribute("hidden", ""); btn.textContent = "查看技术详情"; }
  });
}
async function getJSON(path, opts = {}) {
  try {
    const res = await fetch(API + path, { cache: "no-store", signal: opts.signal });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; }
    catch {
      throw makeApiError(
        res.ok ? "返回非 JSON" : `HTTP ${res.status}，返回非 JSON（可能是 HTML 错误页）`,
        path,
        { httpStatus: res.status, rawSnippet: text.slice(0, 200) }
      );
    }
    if (!json) throw makeApiError("空响应", path, { httpStatus: res.status });
    if (json.code && json.code !== 200) {
      throw makeApiError(json.message || "接口异常", path, { apiCode: json.code, httpStatus: res.status });
    }
    if (json.message === "数据异常" && json.data == null) {
      throw makeApiError("数据异常", path, { apiCode: json.code });
    }
    if (!res.ok && !json.data) throw makeApiError(`HTTP ${res.status}`, path, { httpStatus: res.status });
    return json.data;
  } catch (e) {
    if (e?.name === "AbortError") throw e;
    if (!e.apiPath) e.apiPath = path;
    throw e;
  }
}

function stripRegionSuffix(name) {

  try {
    const d = await fetchJsonAny("https://ipwho.is/");
    if (d && d.success !== false) {
      const isCN = /CN|China|中国/i.test(String(d.country_code || d.country || ""));

  // 2) ipinfo.io：英文城市，再映射中文
  try {
    const d = await fetchJsonAny("https://ipinfo.io/json");
    const isCN = /CN|China/i.test(String(d.country || ""));
    if (isCN) {
      const city = normalizeCityName(d.city) || normalizeCityName(d.region);
      if (city) return { city, source: "ipinfo.io", ip: d.ip || "" };
    }
  } catch {}

  // 3) 60s /ip：兜底（多数情况 city 为空，因为走 Cloudflare）
  try {
    const d = await getJSON("/ip");
    const isCN = !d.country || /中国|China|CN/i.test(String(d.country));
    if (isCN) {

  rss: {
    title: "RSS 订阅",
    desc: "支持 Atom / RSS 2.0 · 内置源可直接阅读 · 自定义源可添加（需目标站点开启 CORS）",
    /* 内置订阅源：后续扩展只需往这里 push 一项即可 */
    builtins: [
      {
        id: "githubweekly",
        name: "GitHub 一周热点",
        url: "https://itcoffee66.github.io/githubweekly/feed.xml",
        home: "https://itcoffee66.github.io/githubweekly/",
        desc: "IT咖啡馆 · 每周 GitHub 热门开源",
      },
      {
        id: "60s-rss",
        name: "60s 每日新闻",
        url: "https://60.newday.cc.cd/v2/60s/rss",
        home: "https://github.com/vikiboss/60s",
        desc: "60s 每日资讯 RSS",
      },
      {
        id: "60s-rss",
        name: "60s 每日新闻",
        url: "https://www.gdufe888.top/api/rss.xml",
        home: "https://www.gdufe888.top",
        desc: "每日开源热榜",
      },
    ],
    state: { tab: "githubweekly", custom: null },
    _loadCustom() {
      try {
        const raw = JSON.parse(localStorage.getItem("rss-custom-feeds") || "[]");
        if (!Array.isArray(raw)) return [];
        // 过滤非法条目，仅保留 https/http
        return raw.filter(f => f && f.id && f.name && safeURL(f.url)).map(f => ({
          id: String(f.id).slice(0, 40),
          name: String(f.name).slice(0, 80),
          url: safeURL(f.url),
          home: safeURL(f.home) || "",
          desc: String(f.desc || "").slice(0, 160),
        }));
      } catch { return []; }
    },
    _saveCustom(list) {
      try {
        localStorage.setItem("rss-custom-feeds", JSON.stringify(list));
      } catch (e) {
        throw makeApiError("无法保存到本机（可能超出存储配额）", "localStorage");
      }
    },
    _allFeeds() {
      const custom = this._loadCustom().map(f => ({ ...f, custom: true }));
      return [...this.builtins, ...custom];
    },
    render() {
      this.state.custom = this._loadCustom();
      const feeds = this._allFeeds();
      // 若当前 tab 不存在，回退第一个
      if (!feeds.find(f => f.id === this.state.tab)) {
        this.state.tab = feeds[0]?.id || "manage";
      }
      const tabs = [
        ...feeds.map(f => ({ k: f.id, n: f.name })),
        { k: "manage", n: "⚙ 管理源" },
      ];
      makeSubtabs(tabs, this.state.tab, k => { this.state.tab = k; this.render(); });
      if (this.state.tab === "manage") {
        this._renderManage();
      } else {
        const feed = feeds.find(f => f.id === this.state.tab);
        $("viewBody").innerHTML = `<div class="grid">${card(12,"📰", feed?.name || "RSS", feed?.desc || "", "c-rss")}</div>`;
        this._loadFeed(feed);
      }
    },
    _renderManage() {
      const custom = this._loadCustom();
      $("viewBody").innerHTML = `<div class="grid">
        <section class="card col-12">
          <div class="card-head"><div class="ico">➕</div><h3>添加 RSS / Atom 源</h3></div>
          <div class="tool-form">
            <input id="rss-name" placeholder="名称（可选，留空自动读取）" style="max-width:200px">
            <input id="rss-url" placeholder="Feed 地址，如 https://example.com/feed.xml">
            <button id="rss-add">添加</button>
          </div>
          <div class="note">说明：浏览器直接请求需目标站点设置 CORS；GitHub Pages 等多数静态源可用。添加后保存在本机 localStorage。</div>
          <div id="rss-add-msg" style="margin-top:10px"></div>
        </section>
        <section class="card col-12">
          <div class="card-head"><div class="ico">📋</div><h3>已配置的源</h3></div>
          <div class="rss-manage" id="rss-list"></div>
        </section>
      </div>`;
      this._paintList();
      $("rss-add").onclick = () => this._addFeed();
    },
    _paintList() {
      const box = $("rss-list"); if (!box) return;
      const rows = this._allFeeds().map(f => `
        <div class="rss-row" data-id="${esc(f.id)}">
          <span class="tag ${f.custom?"custom":""}">${f.custom?"自定义":"内置"}</span>
          <span class="nm">${esc(f.name)}</span>
          <span class="url">${esc(f.url)}</span>
          <button class="btn-ghost rss-open" data-id="${esc(f.id)}">打开</button>
          ${f.custom?`<button class="btn-ghost btn-danger rss-del" data-id="${esc(f.id)}">删除</button>`:""}
        </div>`).join("");
      box.innerHTML = rows || `<div class="empty">暂无订阅源</div>`;
      box.querySelectorAll(".rss-open").forEach(btn => {
        btn.onclick = () => { this.state.tab = btn.dataset.id; this.render(); };
      });
      box.querySelectorAll(".rss-del").forEach(btn => {
        btn.onclick = () => {
          const list = this._loadCustom().filter(x => x.id !== btn.dataset.id);
          this._saveCustom(list);
          this._paintList();
        };
      });
    },
    async _addFeed() {
      const msg = $("rss-add-msg");
      const rawUrl = ($("rss-url").value || "").trim();
      let name = ($("rss-name").value || "").trim();
      if (!rawUrl) { msg.innerHTML = `<div class="err">请填写 Feed 地址</div>`; return; }
      const url = safeURL(rawUrl);
      if (!url) { msg.innerHTML = `<div class="err">仅支持 http/https 协议的 Feed 地址</div>`; return; }
      msg.innerHTML = SK("正在校验 Feed…");
      try {
        const feed = await fetchAndParseRSS(url);
        if (!name) name = feed.title || "未命名源";
        const id = "c_" + Math.random().toString(36).slice(2, 9);
        const list = this._loadCustom();
        if (list.some(x => x.url === url) || this.builtins.some(x => x.url === url)) {
          throw makeApiError("该 Feed 已存在", url);
        }
        if (list.length >= 30) throw makeApiError("自定义源最多 30 个，请先删除部分", url);
        list.push({
          id,
          name: String(name).slice(0, 80),
          url,
          home: safeURL(feed.link) || "",
          desc: String(feed.subtitle || "").slice(0, 160),
        });
        this._saveCustom(list);
        msg.innerHTML = `<div class="tip">已添加「${esc(name)}」，共解析 ${feed.items.length} 条</div>`;
        $("rss-url").value = ""; $("rss-name").value = "";
        this._paintList();
      } catch (e) {
        fail(msg, e, url);
      }
    },
    async _loadFeed(feed) {
      const token = makeLoadToken(this);
      const box = $("c-rss"); if (!box || !feed) return;
      const feedId = feed.id;
      box.innerHTML = SK("拉取 Feed…");
      try {
        const data = await fetchAndParseRSS(feed.url);
        if (!isLoadCurrent(this, token) || this.state.tab !== feedId) return;
        const sub = $("c-rss-sub");
        if (sub) sub.textContent = `${data.items.length} 条 · ${data.updated || ""}`;
        if (!data.items.length) {
          box.innerHTML = `<div class="empty">Feed 中暂无条目</div>`;
          return;
        }
        const home = safeURL(feed.home);
        box.innerHTML = data.items.slice(0, 40).map(it => {
          const href = safeURL(it.link);
          return `<div class="rss-item">
            ${href
              ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer"><div class="rt">${esc(it.title||"（无标题）")}</div></a>`
              : `<div class="rt">${esc(it.title||"（无标题）")}</div>`}
            <div class="rm">${esc(it.date||"")}${it.author?` · ${esc(it.author)}`:""}${feed.name?` · ${esc(feed.name)}`:""}</div>
            ${it.summary?`<div class="rs">${esc(it.summary)}</div>`:""}
          </div>`;
        }).join("") +
          (home ? `<div class="note" style="margin-top:14px">来源站点：<a href="${esc(home)}" target="_blank" rel="noopener noreferrer">${esc(home)}</a></div>` : "");
      } catch (e) {
        if (e?.name === "AbortError" || !isLoadCurrent(this, token) || this.state.tab !== feedId) return;
        fail(box, e, feed.url);
      }
    }
  }
};

/* ================= RSS 解析（Atom / RSS 2.0） ================= */
function textOf(el) {
  if (!el) return "";
  return (el.textContent || "").trim();
}
function attrOf(el, name) {
  return el?.getAttribute?.(name) || "";
}
function first(el, sel) {
  return el?.querySelector?.(sel) || null;
}
function stripHtmlLite(html) {
  return String(html || "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\s+/g, " ").trim();
}
function fmtRssDate(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return s;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function parseRSSXML(xmlText, sourceUrl) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const parseErr = doc.querySelector("parsererror");
  if (parseErr) throw makeApiError("Feed XML 解析失败", sourceUrl);

  // Atom
  const feedEl = doc.querySelector("feed");
  if (feedEl) {
    const title = textOf(first(feedEl, "title"));
    const subtitle = textOf(first(feedEl, "subtitle"));
    const updated = fmtRssDate(textOf(first(feedEl, "updated")));
    let link = "";
    feedEl.querySelectorAll("link").forEach(l => {
      const rel = attrOf(l, "rel") || "alternate";
      if (rel === "alternate" && !link) link = attrOf(l, "href");
      if (!link && attrOf(l, "href")) link = attrOf(l, "href");
    });
    const items = [...feedEl.querySelectorAll("entry")].map(en => {
      let itemLink = "";
      en.querySelectorAll("link").forEach(l => {
        const rel = attrOf(l, "rel") || "alternate";
        if (rel === "alternate" && !itemLink) itemLink = attrOf(l, "href");
        if (!itemLink) itemLink = attrOf(l, "href");
      });
      const summary = textOf(first(en, "summary")) || stripHtmlLite(textOf(first(en, "content")));
      return {
        title: textOf(first(en, "title")),
        link: itemLink,
        date: fmtRssDate(textOf(first(en, "published")) || textOf(first(en, "updated"))),
        author: textOf(first(en, "author name")) || textOf(first(en, "author")),
        summary,
      };
    });
    return { title, subtitle, link, updated, items, type: "atom" };
  }

  // RSS 2.0
  const channel = doc.querySelector("channel");
  if (channel) {
    const title = textOf(first(channel, "title"));
    const subtitle = textOf(first(channel, "description"));
    const link = textOf(first(channel, "link"));
    const updated = fmtRssDate(textOf(first(channel, "lastBuildDate")) || textOf(first(channel, "pubDate")));
    const items = [...channel.querySelectorAll("item")].map(it => {
      const linkText = textOf(first(it, "link"));
      const guidEl = first(it, "guid");
      const guidText = textOf(guidEl);
      const link = linkText || (attrOf(guidEl, "isPermaLink") !== "false" ? guidText : "");
      return {
        title: textOf(first(it, "title")),
        link,
        date: fmtRssDate(textOf(first(it, "pubDate"))),
        author: textOf(first(it, "author")) || textOf(it.getElementsByTagNameNS("http://purl.org/dc/elements/1.1/", "creator")[0]) || textOf(it.getElementsByTagName("creator")[0]),
        summary: stripHtmlLite(textOf(first(it, "description")) || textOf(it.getElementsByTagNameNS("http://purl.org/rss/1.0/modules/content/", "encoded")[0]) || textOf(it.getElementsByTagName("encoded")[0])),
      };
    });
    return { title, subtitle, link, updated, items, type: "rss" };
  }

  throw makeApiError("无法识别的 Feed 格式（非 Atom / RSS 2.0）", sourceUrl);
}
async function fetchAndParseRSS(url) {
  const safe = safeURL(url);
  if (!safe) throw makeApiError("非法 Feed 地址（仅支持 http/https）", url);
  let res;
  try {
    res = await fetch(safe, { cache: "no-store" });
  } catch (e) {
    throw makeApiError("网络请求失败（可能被 CORS 拦截或断网）", safe);
  }
  const text = await res.text();
  if (!res.ok) {
    throw makeApiError(`HTTP ${res.status}，Feed 不可用`, safe, { httpStatus: res.status, rawSnippet: text.slice(0, 200) });
  }
  // 某些接口把 RSS 包在 JSON 里
  if (text.trim().startsWith("{")) {
    try {
      const j = JSON.parse(text);
      if (typeof j.data === "string") return parseRSSXML(j.data, safe);
      if (j.rss || j.feed) return parseRSSXML(j.rss || j.feed, safe);
    } catch {}
  }
  return parseRSSXML(text, safe);
}

/* ================= 导航 / 路由 ================= */
const NAV = [
  {k:"home",    ic:"🏠", n:"今日概览"},
  {k:"hot",     ic:"🔥", n:"全网热榜"},
  {k:"news",    ic:"💻", n:"科技资讯"},
  {k:"rss",     ic:"📡", n:"RSS 订阅"},
  {k:"life",    ic:"✨", n:"每日一刻"},
  {k:"media",   ic:"🎬", n:"影音娱乐"},
  {k:"finance", ic:"💱", n:"财经生活"},
  {k:"weather", ic:"🌤️", n:"天气"},
  {k:"tools",   ic:"🛠️", n:"实用工具"},
];
let current = "home";

function buildNav() {
  $("nav").innerHTML = NAV.map(n=>
    `<li role="button" tabindex="0" data-k="${n.k}" class="${n.k===current?"active":""}" aria-current="${n.k===current?"page":"false"}"><span class="ic">${n.ic}</span>${n.n}</li>`
  ).join("");
}
function go(key) {
  if (!VIEWS[key]) key = "home";
  current = key;
  // 递增全局视图 token，使旧视图异步回调失效
  window.__viewToken = (window.__viewToken || 0) + 1;
  buildNav();
  const v = VIEWS[key];
  $("viewTitle").textContent = v.title;
  $("viewDesc").textContent = v.desc || "";
  $("subtabsWrap").innerHTML = "";
  $("viewBody").innerHTML = SK("加载中…");
  v.render();
  location.hash = key;
  if (window.innerWidth <= 860) $("nav").classList.add("collapsed");
}
$("nav").addEventListener("click",(e)=>{
  const li=e.target.closest("li"); if(!li) return;
  go(li.dataset.k);
});
$("nav").addEventListener("keydown",(e)=>{
  if (e.key !== "Enter" && e.key !== " ") return;
  const li=e.target.closest("li"); if(!li) return;
  e.preventDefault();
  go(li.dataset.k);
});
$("btnRefresh").addEventListener("click",()=>{
  const btn=$("btnRefresh"); btn.classList.add("spin");
  VIEWS[current].render();
  setTimeout(()=>btn.classList.remove("spin"),1000);
});
$("menuToggle").addEventListener("click",()=> $("nav").classList.toggle("collapsed"));
window.addEventListener("hashchange",()=>{
  const k=(location.hash||"#home").slice(1);
  if (k !== current) go(k);
});

buildNav();
go((location.hash||"#home").slice(1) || "home");
getJSON("/60s").then(d=>{
  $("sideDate").textContent=d.date||"";
  $("sideWeek").textContent=weekName(d.date);
}).catch(()=>{
  $("sideDate").textContent=new Date().toISOString().slice(0,10);
  $("sideWeek").textContent=weekName();
});
