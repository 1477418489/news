<script>
/* 常用配置见仓库根目录 config.js（VERSION / RSS_FEEDS / API_BASE） */
const CFG = window.APP_CONFIG || {};
const API = CFG.API_BASE || "https://60.newday.cc.cd/v2";
const APP_VERSION = CFG.VERSION || "0.0.0";
const RSS_FEEDS = Array.isArray(CFG.RSS_FEEDS) ? CFG.RSS_FEEDS : [];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/** 仅允许 http(s) 与相对路径，拦截 javascript:/data: 等 */
function safeURL(u) {
  if (u == null || u === "") return "";
  const s = String(u).trim();
  if (!s || s === "#") return "";
  // 协议相对 //example.com
  if (s.startsWith("//")) return "https:" + s;
  // 相对路径
  if (s.startsWith("/") && !s.startsWith("//")) return s;
  try {
    const parsed = new URL(s, location.href);
    if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
  } catch {}
  return "";
}
/** 解析媒体资源 URL：相对路径优先按 API 根域名拼接，避免挂到当前站点导致图片失效 */
function mediaURL(u) {
  if (u == null || u === "") return "";
  const s = String(u).trim();
  if (!s || s === "#") return "";
  if (s.startsWith("data:image/")) return s;
  try {
    let abs;
    if (s.startsWith("//")) abs = "https:" + s;
    else if (/^https?:\/\//i.test(s)) abs = s;
    else {
      // 相对路径按 API 根域名解析，避免挂到 Cloudflare 站点域名
      const base = new URL(API);
      abs = s.startsWith("/")
        ? new URL(s, base.origin).href
        : new URL(s, base.href.endsWith("/") ? base.href : base.href + "/").href;
    }
    const parsed = new URL(abs);
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
    // HTTPS 页面避免混合内容拦截
    if (typeof location !== "undefined" && location.protocol === "https:" && parsed.protocol === "http:") {
      parsed.protocol = "https:";
    }
    return parsed.href;
  } catch {
    return "";
  }
}
function weatherIconImg(url, cls="wx-icon") {
  const src = mediaURL(url);
  if (!src) return "";
  return `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" decoding="async" onerror="this.classList.add('broken')">`;
}
/** CSS url() 安全片段（用于 style 属性） */
function cssUrl(u) {
  const s = safeURL(u);
  if (!s) return "none";
  // 去掉会打断 CSS 的字符
  const cleaned = s.replace(/['"\\)\s\n\r\f]/g, "");
  if (!cleaned || !/^https?:\/\//i.test(cleaned) && !cleaned.startsWith("/")) return "none";
  return `url("${cleaned}")`;
}
const A = (link, text, cls="") => {
  const href = safeURL(link);
  return href
    ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="${cls}">${esc(text)}</a>`
    : `<span class="${cls}">${esc(text)}</span>`;
};
const SK = (t="加载中…") => `<div class="skeleton"><span class="dot"></span>${t}</div>`;
/** 生成一次视图加载 token，防止快速切 tab 写回旧结果 */
function makeLoadToken(owner) {
  owner._loadToken = (owner._loadToken || 0) + 1;
  return owner._loadToken;
}
function isLoadCurrent(owner, token) {
  return owner._loadToken === token;
}

function makeApiError(message, path, extra={}) {
  const e = new Error(message || "接口异常");
  e.apiPath = path || "";
  Object.assign(e, extra);
  return e;
}
/** 把接口/网络原始错误整理成可读结构（剥离 HTML 源码） */
function parseApiError(err, path) {
  const raw = String(err?.message ?? err ?? "未知错误");
  const apiPath = path || err?.apiPath || "";
  const httpMatch = raw.match(/status:\s*(\d+)/i) || raw.match(/HTTP\s+(\d+)/i);
  const httpStatus = err?.httpStatus || (httpMatch ? httpMatch[1] : null);
  const apiCode = err?.apiCode;

  // 去掉 message 中夹带的 HTML 错误页
  let cleaned = raw
    .replace(/response:\s*<[\s\S]*/i, "response: [上游返回 HTML 错误页，已省略]")
    .replace(/<!doctype[\s\S]*/i, "[HTML 文档，已省略]")
    .replace(/<html[\s\S]*/i, "[HTML 文档，已省略]")
    .replace(/<[^>]+>/g, " ")
    .replace(/&[a-z]+;/gi, " ")
    .replace(/\s+/g, " ")
    .trim();

  let friendly = "数据加载失败";
  let reason = cleaned.slice(0, 160) || "未知原因";

  if (/Failed to fetch|NetworkError|Load failed|网络/i.test(raw)) {
    friendly = "网络请求失败";
    reason = "无法连接到服务，可能是跨域（CORS）限制、断网或接口不可达。";
  } else if (httpStatus) {
    friendly = `上游服务异常（HTTP ${httpStatus}）`;
    reason = "源站没有返回正常数据，而是错误页。该订阅源/接口当前可能不可用。";
  } else if (apiCode && apiCode >= 500) {
    friendly = `服务端错误（code ${apiCode}）`;
    reason = cleaned.replace(/^服务器出错了[.…\s]*/i, "") || "接口内部出错，请稍后再试。";
  } else if (apiCode && apiCode >= 400) {
    friendly = `请求无效（code ${apiCode}）`;
    reason = cleaned;
  } else if (/数据异常|暂无/.test(raw)) {
    friendly = "暂无可用数据";
    reason = "接口响应成功，但内容为空或异常。";
  } else if (/未找到|404|not found/i.test(raw)) {
    friendly = "未找到内容";
    reason = cleaned;
  } else if (/参数/.test(raw)) {
    friendly = "请求参数有误";
    reason = cleaned;
  } else if (/非 JSON|解析失败|Unexpected token/i.test(raw)) {
    friendly = "响应格式异常";
    reason = "期望 JSON，但收到了无法解析的内容（可能是 HTML 错误页）。";
  } else if (/CORS/i.test(raw)) {
    friendly = "跨域被拦截";
    reason = "浏览器因 CORS 策略阻止了该请求。";
  }

  // 技术详情：截断 + 去掉 HTML
  let detail = raw
    .replace(/response:\s*<[\s\S]*/i, "response: [上游 HTML 错误页已省略]")
    .replace(/<!doctype[\s\S]*/i, "[HTML 已省略]");
  if (detail.length > 600) detail = detail.slice(0, 600) + "…";

  return { friendly, reason, detail, path: apiPath, httpStatus, apiCode };
}
function fail(el, err, path) {
  if (!el) return;
  const info = (err && err.friendly) ? err : parseApiError(err, path);
  const id = "err-" + Math.random().toString(36).slice(2, 9);
  el.innerHTML = `<div class="err-card">
    <div class="err-ico">!</div>
    <div class="err-body">
      <div class="err-title">${esc(info.friendly)}</div>
      <div class="err-reason">${esc(info.reason)}</div>
      ${info.path ? `<div class="err-path">${esc(info.path)}</div>` : ""}
      <button type="button" class="err-toggle" data-target="${id}">查看技术详情</button>
      <pre class="err-detail" id="${id}" hidden>${esc(info.detail || "")}</pre>
    </div>
  </div>`;
  el.querySelector(".err-toggle")?.addEventListener("click", (ev) => {
    const btn = ev.currentTarget;
    const t = document.getElementById(btn.dataset.target);
    if (!t) return;
    const open = t.hasAttribute("hidden");
    if (open) { t.removeAttribute("hidden"); btn.textContent = "收起技术详情"; }
    else { t.setAttribute("hidden", ""); btn.textContent = "查看技术详情"; }
  });
}
async function getJSON(path, opts = {}) {
  try {
    const res = await fetch(API + path, { cache: "no-store", signal: opts.signal });
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; }
    catch {
      throw makeApiError(
        res.ok ? "返回非 JSON" : `HTTP ${res.status}，返回非 JSON（可能是 HTML 错误页）`,
        path,
        { httpStatus: res.status, rawSnippet: text.slice(0, 200) }
      );
    }
    if (!json) throw makeApiError("空响应", path, { httpStatus: res.status });
    if (json.code && json.code !== 200) {
      throw makeApiError(json.message || "接口异常", path, { apiCode: json.code, httpStatus: res.status });
    }
    if (json.message === "数据异常" && json.data == null) {
      throw makeApiError("数据异常", path, { apiCode: json.code });
    }
    if (!res.ok && !json.data) throw makeApiError(`HTTP ${res.status}`, path, { httpStatus: res.status });
    return json.data;
  } catch (e) {
    if (e?.name === "AbortError") throw e;
    if (!e.apiPath) e.apiPath = path;
    throw e;
  }
}
function weekName(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  return "星期" + "日一二三四五六"[d.getDay()];
}
/* 根据访问 IP 推断天气城市
 * 注意：60s 的 /ip 走 Cloudflare，经常返回美国空城市，不能单独依赖它。
 * 天气接口参数是 query（不是 city），写错会永远回落到北京。
 */
let _localCityPromise = null;
const CITY_EN_ZH = {
  beijing:"北京", shanghai:"上海", tianjin:"天津", chongqing:"重庆",
  wuhan:"武汉", guangzhou:"广州", shenzhen:"深圳", hangzhou:"杭州",
  chengdu:"成都", nanjing:"南京", xian:"西安", "xi'an":"西安",
  suzhou:"苏州", zhengzhou:"郑州", changsha:"长沙", shenyang:"沈阳",
  qingdao:"青岛", dalian:"大连", ningbo:"宁波", xiamen:"厦门",
  fuzhou:"福州", jinan:"济南", hefei:"合肥", kunming:"昆明",
  nanning:"南宁", nanchang:"南昌", harbin:"哈尔滨", haerbin:"哈尔滨",
  changchun:"长春", shijiazhuang:"石家庄", taiyuan:"太原",
  huhehaote:"呼和浩特", hohhot:"呼和浩特", urumqi:"乌鲁木齐",
  wulumuqi:"乌鲁木齐", lhasa:"拉萨", yinchuan:"银川", xining:"西宁",
  haikou:"海口", sanya:"三亚", dongguan:"东莞", foshan:"佛山",
  wuxi:"无锡", zhuhai:"珠海", zhongshan:"中山", huizhou:"惠州",
  ezhou:"鄂州", xiangyang:"襄阳", yichang:"宜昌", jingzhou:"荆州",
  huangshi:"黄石", xiaogan:"孝感", huanggang:"黄冈",
  "ezhou shi":"鄂州", "wuhan shi":"武汉", "hubei sheng":"武汉"
};
function stripRegionSuffix(name) {
  return String(name || "")
    .replace(/(特别行政区|壮族自治区|回族自治区|维吾尔自治区|自治区|省|市|区|县|州|盟|地区|Sheng|Shi)$/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}
function normalizeCityName(raw) {
  if (!raw) return "";
  let s = stripRegionSuffix(String(raw));
  if (!s) return "";
  // 英文城市名 → 中文（天气接口只认中文 query）
  const key = s.toLowerCase();
  if (CITY_EN_ZH[key]) return CITY_EN_ZH[key];
  // 已是中文
  if (/[一-鿿]/.test(s)) return s;
  return "";
}
async function fetchJsonAny(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
async function detectCityFromSources() {
  // 1) ipwho.is：中文友好，CORS 开放（实测可定位到湖北鄂州/武汉一带）
  try {
    const d = await fetchJsonAny("https://ipwho.is/");
    if (d && d.success !== false) {
      const isCN = /CN|China|中国/i.test(String(d.country_code || d.country || ""));
      if (isCN) {
        const city = normalizeCityName(d.city) || normalizeCityName(d.region);
        if (city) return { city, source: "ipwho.is", ip: d.ip || "" };
      }
    }
  } catch {}

  // 2) ipinfo.io：英文城市，再映射中文
  try {
    const d = await fetchJsonAny("https://ipinfo.io/json");
    const isCN = /CN|China/i.test(String(d.country || ""));
    if (isCN) {
      const city = normalizeCityName(d.city) || normalizeCityName(d.region);
      if (city) return { city, source: "ipinfo.io", ip: d.ip || "" };
    }
  } catch {}

  // 3) 60s /ip：兜底（多数情况 city 为空，因为走 Cloudflare）
  try {
    const d = await getJSON("/ip");
    const isCN = !d.country || /中国|China|CN/i.test(String(d.country));
    if (isCN) {
      const city = normalizeCityName(d.city) || normalizeCityName(d.district) || normalizeCityName(d.prov);
      if (city) return { city, source: "60s/ip", ip: d.ip || "" };
    }
  } catch {}

  return { city: "北京", source: "fallback", ip: "" };
}
async function getLocalCity() {
  if (_localCityPromise) return _localCityPromise;
  _localCityPromise = detectCityFromSources().then(r => r.city || "北京");
  return _localCityPromise;
}
let _localCityDetailPromise = null;
function detectCityFromSourcesCached() {
  if (_localCityDetailPromise) return _localCityDetailPromise;
  _localCityDetailPromise = detectCityFromSources();
  // 同步城市缓存
  _localCityPromise = _localCityDetailPromise.then(r => r.city || "北京");
  return _localCityDetailPromise;
}
function resetLocalCityCache() {
  _localCityPromise = null;
  _localCityDetailPromise = null;
}
function weatherURL(kind, city) {
  // 关键：参数名必须是 query
  return `/weather/${kind}?query=${encodeURIComponent(city)}`;
}
function fmtHot(v) {
  if (v == null || v === "") return "";
  const n = Number(v);
  if (isNaN(n)) return esc(v);
  if (n >= 1e8) return (n / 1e8).toFixed(1) + "亿";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + "万";
  return String(n);
}
function card(col, ico, title, sub, bodyId) {
  return `<section class="card col-${col}">
    <div class="card-glow" aria-hidden="true"></div>
    <div class="card-head"><div class="ico">${ico}</div><div class="card-title"><h3>${esc(title)}</h3></div>
    ${sub!=null?`<span class="sub" id="${bodyId}-sub">${esc(sub)}</span>`:""}</div>
    <div class="card-body" id="${bodyId}">${SK()}</div></section>`;
}
async function fillCard(id, loader, render) {
  const box = $(id); if (!box) return;
  try { render(box, await loader()); } catch (e) { fail(box, e, e.apiPath); }
}
function renderHotList(list, limit=20) {
  if (!list || !list.length) return `<div class="empty">暂无数据</div>`;
  return `<ul class="hot-list">${list.slice(0,limit).map((it,i)=>{
    const title=it.title||it.query||it.word||it.programme_name||it.movie_name||"";
    const val=fmtHot(it.hot_value??it.hot??it.hotValue??it.score??it.score_desc??it.market_rate_desc??it.box_office_desc);
    const rankCls = i < 3 ? ` top${i+1}` : "";
    return `<li class="hot-row${rankCls}"><span class="hot-rank">${i+1}</span><div class="hot-main">${A(it.link||it.url,title)}${val?`<span class="hot-val">${val}</span>`:""}</div></li>`;
  }).join("")}</ul>`;
}
function renderNewsList(list, withMeta=false, limit=15) {
  if (!list || !list.length) return `<div class="empty">暂无数据</div>`;
  return `<ul class="plain-list">${list.slice(0,limit).map(it=>{
    const meta=withMeta?`<div class="meta">${esc(it.source||"")}${it.score!=null?` · ${it.score} 分`:""}${it.author?` · ${esc(it.author)}`:""}</div>`:"";
    return `<li>${A(it.link||it.url,it.title)}${meta}</li>`;
  }).join("")}</ul>`;
}
function kv(rows) {
  return `<ul class="kv-list">${rows.filter(Boolean).map(([k,v])=>{
    // 兼容调用方已 esc 或未 esc：去标签后统一再转义，复制用纯文本
    let plain = String(v ?? "");
    // 若看起来已 HTML 转义，先解码再处理，避免 &amp;amp;
    if (/&(?:amp|lt|gt|quot|#39);/.test(plain) && !/<[a-zA-Z!]/.test(plain)) {
      plain = plain
        .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
        .replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    }
    plain = plain.replace(/<[^>]+>/g, "");
    return `<li><span class="k">${esc(k)}</span><span class="v">${esc(plain)}</span>
     <span class="copy" data-copy="${esc(plain)}">复制</span></li>`;
  }).join("")}</ul>`;
}
function bindCopy(root) {
  root.querySelectorAll(".copy").forEach(el=>{
    el.onclick=()=>{ navigator.clipboard?.writeText(el.dataset.copy||"").then(()=>{
      const t=el.textContent; el.textContent="已复制"; setTimeout(()=>el.textContent=t,1200);
    }).catch(()=>{}); };
  });
}
function renderPosters(list, mapFn) {
  if (!list || !list.length) return `<div class="empty">暂无数据</div>`;
  return `<div class="poster-row">${list.map(mapFn).join("")}</div>`;
}
function makeSubtabs(tabs, active, onClick) {
  $("subtabsWrap").innerHTML = `<div class="subtabs">${tabs.map(t=>
    `<span class="subtab ${t.k===active?"active":""}" data-k="${t.k}">${t.n}</span>`
  ).join("")}</div>`;
  $("subtabsWrap").onclick = (e) => {
    const el = e.target.closest(".subtab"); if (!el) return;
    onClick(el.dataset.k);
  };
}

  weather: {

      $("subtabsWrap").innerHTML="";
      $("viewBody").innerHTML=`<div class="grid">
        <section class="card col-12">
          <div class="card-head"><div class="ico">🌤️</div><h3>城市天气</h3><span class="sub" id="wx-loc-sub">正在根据 IP 定位…</span></div>

            <button id="wx-btn">查询</button>
            <button id="wx-relocate" type="button" class="btn-secondary">按 IP 重定位</button>
          </div>
          <div id="wx-out">${SK("定位并查询中…")}</div>
        </section>
      </div>`;
      const run=async(city)=>{
        city=(city||$("wx-city").value.trim()||(await detectCityFromSourcesCached()).city||"北京");
        this.state.city=city;
        $("wx-city").value=city;
        const out=$("wx-out"); out.innerHTML=SK();
        try {
          const [rt, fc] = await Promise.all([
            getJSON(weatherURL("realtime", city)),
            getJSON(weatherURL("forecast", city)),
          ]);
          const w=rt.weather||{}, aq=rt.air_quality||{}, loc=rt.location||{}, sr=rt.sunrise||{};
          const days=fc.daily_forecast||[];
          const hours=(fc.hourly_forecast||[]).slice(0,12);
          const life=rt.life_indices||[];
          out.innerHTML=`
            <div class="wx-hero">
              ${weatherIconImg(w.weather_icon || w.icon || w.condition_icon, "wx-icon")}
              <div class="wx-temp">${esc(w.temperature)}°</div>
              <div class="wx-meta">
                <div style="font-size:17px;font-weight:700;color:var(--text)">${esc(loc.city||loc.name)} · ${esc(w.condition)}</div>
                <div>${esc(w.wind_direction)} ${esc(w.wind_power)} · 湿度 ${esc(w.humidity)}% · 气压 ${esc(w.pressure)}hPa</div>
                <div>空气 ${esc(aq.quality)} AQI ${esc(aq.aqi)} · PM2.5 ${esc(aq.pm25)} · 日出 ${esc(sr.sunrise_desc)} / 日落 ${esc(sr.sunset_desc)}</div>
                <div>更新 ${esc(w.updated||"")}</div>
              </div>
            </div>
            <div style="font-weight:600;margin:8px 0 10px">未来预报</div>
            <div class="wx-days">${days.slice(0,10).map(d=>`
              <div class="wx-day">
                <div class="dt">${esc((d.date||"").slice(5))}</div>
                ${weatherIconImg(d.day_weather_icon || d.icon || d.weather_icon, "wx-icon sm")}
                <div class="t">${esc(d.min_temperature)}~${esc(d.max_temperature)}°</div>
                <div class="c">${esc(d.day_condition)}/${esc(d.night_condition)}</div>
                <div class="c">AQI ${esc(d.aqi||"-")}</div>
              </div>`).join("")}</div>
            ${hours.length?`<div style="font-weight:600;margin:18px 0 10px">逐时预报</div>
              <div class="wx-days">${hours.map(h=>`
                <div class="wx-day">
                  <div class="dt">${esc((h.datetime||"").slice(11,16))}</div>
                  <div class="t">${esc(h.temperature)}°</div>
                  <div class="c">${esc(h.condition)}</div>
                </div>`).join("")}</div>`:""}
            ${life.length?`<div style="font-weight:600;margin:18px 0 10px">生活指数</div>
              <div class="price-grid">${life.map(x=>`
                <div class="price-item"><div class="k">${esc(x.name)}</div>
                  <div class="v" style="font-size:14px">${esc(x.level)}</div>
                  <div class="n">${esc(x.description||"")}</div></div>`).join("")}</div>`:""}
          `;
        } catch(e){ fail(out,e); }
      };
      $("wx-btn").onclick=()=>run();
      $("wx-relocate").onclick=async()=>{
        resetLocalCityCache();
        const sub=$("wx-loc-sub"); if(sub) sub.textContent="正在根据 IP 定位…";
        const info=await detectCityFromSourcesCached();
        if(sub) sub.textContent=(info.source==="fallback"?"定位失败，默认 ":"IP 定位 · ")+info.city+(info.ip?`（${info.ip}）`:"");
        run(info.city);
      };
      // 首次：IP 定位后查询
      let city=this.state.city, srcHint="";
      if (!city) {
        const info=await detectCityFromSourcesCached();
        city=info.city; srcHint=info.source==="fallback"?"定位失败，默认 ":"IP 定位 · ";
        if (info.ip) srcHint += `${info.city}（${info.ip}）`;
        else srcHint += info.city;
      } else {
        srcHint="当前城市 · "+city;
      }
      this.state.city=city;
      $("wx-city").value=city;
      const sub=$("wx-loc-sub"); if(sub) sub.textContent=srcHint;
      run(city);
    }
  },

  rss: {
    title: "RSS 订阅",
    desc: "支持 Atom / RSS 2.0 · 源配置见 config.js · 经同源代理拉取（解决 CORS）",
    state: { tab: "" },
    render() {
      const feeds = RSS_FEEDS;
      if (!feeds.length) {
        $("subtabsWrap").innerHTML = "";
        $("viewBody").innerHTML = `<div class="empty">尚未配置 RSS 源。请编辑仓库根目录 <b>config.js</b> 中的 <code>RSS_FEEDS</code> 后重新部署。</div>`;
        return;
      }
      if (!feeds.find(f => f.id === this.state.tab)) {
        this.state.tab = feeds[0]?.id || "";
      }
      const tabs = feeds.map(f => ({ k: f.id, n: f.name }));
      makeSubtabs(tabs, this.state.tab, k => { this.state.tab = k; this.render(); });
      const feed = feeds.find(f => f.id === this.state.tab);
      $("viewBody").innerHTML = `<div class="grid">${card(12,"📰", feed?.name || "RSS", feed?.desc || "", "c-rss")}</div>`;
      this._loadFeed(feed);
    },
    async _loadFeed(feed) {
      const token = makeLoadToken(this);
      const box = $("c-rss"); if (!box || !feed) return;
      const feedId = feed.id;
      box.innerHTML = SK("拉取 Feed…");
      try {
        const data = await fetchAndParseRSS(feed.url);
        if (!isLoadCurrent(this, token) || this.state.tab !== feedId) return;
        const sub = $("c-rss-sub");
        if (sub) sub.textContent = `${data.items.length} 条 · ${data.updated || ""}`;
        if (!data.items.length) {
          box.innerHTML = `<div class="empty">Feed 中暂无条目</div>`;
          return;
        }
        const home = safeURL(feed.home);
        const allItems = data.items || [];
        const groups = buildRssCategoryGroups(allItems);
        // 默认优先展示「全部」；若源内有更细分类，提供筛选（每日/每周/官方/社区等）
        let activeCat = this.state.rssCat && (this.state.rssCat === "__all__" || groups.some(g => g.key === this.state.rssCat))
          ? this.state.rssCat
          : "__all__";
        this.state.rssCat = activeCat;

        const paint = () => {
          const list = activeCat === "__all__"
            ? allItems
            : allItems.filter(it => (it.categories || []).includes(activeCat));
          const chips = [
            { key: "__all__", label: `全部 ${allItems.length}` },
            ...groups.map(g => ({ key: g.key, label: `${g.key} ${g.count}` })),
          ].map(c => `<button type="button" class="rss-chip${c.key === activeCat ? " active" : ""}" data-cat="${esc(c.key)}">${esc(c.label)}</button>`).join("");

          const shown = list.slice(0, 80);
          const more = list.length > shown.length
            ? `<div class="note" style="margin-top:10px">已显示 ${shown.length}/${list.length} 条。切换上方分类可查看其余内容。</div>`
            : "";

          box.innerHTML = `
            ${groups.length ? `<div class="rss-filters">${chips}</div>` : ""}
            ${shown.map(it => {
              const href = safeURL(it.link);
              const tags = (it.categories || []).slice(0, 4).map(c => `<span class="rss-tag">${esc(c)}</span>`).join("");
              return `<div class="rss-item">
                ${href
                  ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer"><div class="rt">${esc(it.title||"（无标题）")}</div></a>`
                  : `<div class="rt">${esc(it.title||"（无标题）")}</div>`}
                <div class="rm">${esc(it.date||"")}${it.author?` · ${esc(it.author)}`:""}${feed.name?` · ${esc(feed.name)}`:""}</div>
                ${tags ? `<div class="rss-tags">${tags}</div>` : ""}
                ${it.summary?`<div class="rs">${esc(it.summary)}</div>`:""}
              </div>`;
            }).join("")}
            ${more}
            ${home ? `<div class="note" style="margin-top:14px">来源站点：<a href="${esc(home)}" target="_blank" rel="noopener noreferrer">${esc(home)}</a></div>` : ""}
          `;

          box.querySelectorAll(".rss-chip").forEach(btn => {
            btn.onclick = () => {
              activeCat = btn.getAttribute("data-cat") || "__all__";
              this.state.rssCat = activeCat;
              paint();
            };
          });
        };
        paint();
      } catch (e) {
        if (e?.name === "AbortError" || !isLoadCurrent(this, token) || this.state.tab !== feedId) return;
        fail(box, e, feed.url);
      }
    }
  }
};

/* ================= RSS 解析（Atom / RSS 2.0） ================= */
function collectRssCategories(el) {
  if (!el) return [];
  const out = [];
  const seen = new Set();
  const push = (v) => {
    const s = String(v || "").trim();
    if (!s) return;
    const k = s.toLowerCase();
    if (seen.has(k)) return;
    seen.add(k);
    out.push(s);
  };
  // RSS <category>text</category> / Atom <category term="...">
  el.querySelectorAll?.("category").forEach(node => {
    push(attrOf(node, "term") || textOf(node) || attrOf(node, "label"));
  });
  // some feeds put tags in dc:subject
  try {
    const subjects = el.getElementsByTagNameNS?.("http://purl.org/dc/elements/1.1/", "subject") || [];
    [...subjects].forEach(n => push(textOf(n)));
  } catch {}
  return out;
}
/** 聚合分类计数，优先突出每日/每周等可读分组 */
function buildRssCategoryGroups(items) {
  const counts = new Map();
  (items || []).forEach(it => {
    (it.categories || []).forEach(c => {
      counts.set(c, (counts.get(c) || 0) + 1);
    });
  });
  if (!counts.size) return [];
  const preferred = [
    "开源趋势-每日热点", "开源趋势-每周热点",
    "GitHub 日榜", "GitHub 周榜",
    "AI 官方更新", "AI 快讯", "社区讨论",
    "OpenAI", "Anthropic", "InfoQ AI", "TLDR AI", "Hacker News", "V2EX",
  ];
  const preferredSet = new Set(preferred);
  const pref = preferred.filter(k => counts.has(k)).map(k => ({ key: k, count: counts.get(k) }));
  const rest = [...counts.entries()]
    .filter(([k]) => !preferredSet.has(k))
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh"))
    .map(([key, count]) => ({ key, count }));
  // 控制 chip 数量，避免刷屏
  return [...pref, ...rest].slice(0, 16);
}
function textOf(el) {
  if (!el) return "";
  return (el.textContent || "").trim();
}
function attrOf(el, name) {
  return el?.getAttribute?.(name) || "";
}
function first(el, sel) {
  return el?.querySelector?.(sel) || null;
}
function stripHtmlLite(html) {
  return String(html || "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/\s+/g, " ").trim();
}
function fmtRssDate(s) {
  if (!s) return "";
  const raw = String(s).trim();
  const pad = n => String(n).padStart(2, "0");

  // ISO 8601: keep feed wall-clock, avoid local TZ rewrite
  // e.g. 2026-07-24T07:53:43Z / 2026-07-24T15:53:43+08:00
  let m = raw.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?(Z|[+-]\d{2}:?\d{2})?$/i);
  if (m) return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`;

  // RFC 822 / RSS pubDate: Fri, 24 Jul 2026 07:53:43 +0000
  m = raw.match(/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);
  if (m) {
    const months = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12 };
    const mon = months[m[2].toLowerCase()];
    if (mon) return `${m[3]}-${pad(mon)}-${pad(+m[1])} ${m[4]}:${m[5]}`;
  }

  // fallback: Asia/Shanghai for stable display
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  try {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(d);
    const get = (type) => (parts.find((x) => x.type === type) || {}).value || "";
    return `${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")}`;
  } catch {
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
}
function parseRSSXML(xmlText, sourceUrl) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const parseErr = doc.querySelector("parsererror");
  if (parseErr) throw makeApiError("Feed XML 解析失败", sourceUrl);

  // Atom
  const feedEl = doc.querySelector("feed");
  if (feedEl) {
    const title = textOf(first(feedEl, "title"));
    const subtitle = textOf(first(feedEl, "subtitle"));
    const updated = fmtRssDate(textOf(first(feedEl, "updated")));
    let link = "";
    feedEl.querySelectorAll("link").forEach(l => {
      const rel = attrOf(l, "rel") || "alternate";
      if (rel === "alternate" && !link) link = attrOf(l, "href");
      if (!link && attrOf(l, "href")) link = attrOf(l, "href");
    });
    const items = [...feedEl.querySelectorAll("entry")].map(en => {
      let itemLink = "";
      en.querySelectorAll("link").forEach(l => {
        const rel = attrOf(l, "rel") || "alternate";
        if (rel === "alternate" && !itemLink) itemLink = attrOf(l, "href");
        if (!itemLink) itemLink = attrOf(l, "href");
      });
      const summary = textOf(first(en, "summary")) || stripHtmlLite(textOf(first(en, "content")));
      const categories = collectRssCategories(en);
      return {
        title: textOf(first(en, "title")),
        link: itemLink,
        date: fmtRssDate(textOf(first(en, "published")) || textOf(first(en, "updated"))),
        author: textOf(first(en, "author name")) || textOf(first(en, "author")),
        summary,
        categories,
      };
    });
    return { title, subtitle, link, updated, items, type: "atom" };
  }

  // RSS 2.0
  const channel = doc.querySelector("channel");
  if (channel) {
    const title = textOf(first(channel, "title"));
    const subtitle = textOf(first(channel, "description"));
    const link = textOf(first(channel, "link"));
    const updated = fmtRssDate(textOf(first(channel, "lastBuildDate")) || textOf(first(channel, "pubDate")));
    const items = [...channel.querySelectorAll("item")].map(it => {
      const linkText = textOf(first(it, "link"));
      const guidEl = first(it, "guid");
      const guidText = textOf(guidEl);
      const link = linkText || (attrOf(guidEl, "isPermaLink") !== "false" ? guidText : "");
      return {
        title: textOf(first(it, "title")),
        link,
        date: fmtRssDate(textOf(first(it, "pubDate"))),
        author: textOf(first(it, "author")) || textOf(it.getElementsByTagNameNS("http://purl.org/dc/elements/1.1/", "creator")[0]) || textOf(it.getElementsByTagName("creator")[0]),
        summary: stripHtmlLite(textOf(first(it, "description")) || textOf(it.getElementsByTagNameNS("http://purl.org/rss/1.0/modules/content/", "encoded")[0]) || textOf(it.getElementsByTagName("encoded")[0])),
        categories: collectRssCategories(it),
      };
    });
    return { title, subtitle, link, updated, items, type: "rss" };
  }

  throw makeApiError("无法识别的 Feed 格式（非 Atom / RSS 2.0）", sourceUrl);
}
/** 同源 RSS 代理（Cloudflare Pages Function: /api/rss-proxy） */
function rssProxyURL(feedUrl) {
  return `/api/rss-proxy?url=${encodeURIComponent(feedUrl)}`;
}
async function fetchTextViaCandidates(urls, label) {
  let lastErr = null;
  for (const u of urls) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      const text = await res.text();
      // 代理失败时可能返回 JSON 错误
      if (text.trim().startsWith("{")) {
        try {
          const j = JSON.parse(text);
          if (j && j.ok === false) {
            lastErr = makeApiError(j.message || "代理拉取失败", label, { httpStatus: res.status });
            continue;
          }
        } catch {}
      }
      if (!res.ok) {
        lastErr = makeApiError(`HTTP ${res.status}，Feed 不可用`, label, {
          httpStatus: res.status,
          rawSnippet: text.slice(0, 200),
        });
        continue;
      }
      return { text, via: u };
    } catch (e) {
      lastErr = makeApiError(
        e?.message || "网络请求失败（可能被 CORS 拦截或断网）",
        label
      );
    }
  }
  throw lastErr || makeApiError("网络请求失败（可能被 CORS 拦截或断网）", label);
}
async function fetchAndParseRSS(url) {
  const safe = safeURL(url);
  if (!safe) throw makeApiError("非法 Feed 地址（仅支持 http/https）", url);

  // 优先走同源代理（解决第三方 Feed 无 CORS 的问题），失败再直连
  const candidates = [];
  // Cloudflare Pages / 同源环境
  if (typeof location !== "undefined" && /^https?:$/.test(location.protocol)) {
    candidates.push(rssProxyURL(safe));
  }
  candidates.push(safe);

  const { text } = await fetchTextViaCandidates(candidates, safe);

  // 某些接口把 RSS 包在 JSON 里
  if (text.trim().startsWith("{")) {
    try {
      const j = JSON.parse(text);
      if (typeof j.data === "string") return parseRSSXML(j.data, safe);
      if (j.rss || j.feed) return parseRSSXML(j.rss || j.feed, safe);
      if (j.ok === false) throw makeApiError(j.message || "Feed 代理失败", safe);
    } catch (e) {
      if (e?.apiPath) throw e;
    }
  }
  return parseRSSXML(text, safe);
}

function go(key) {

  $("viewDesc").textContent = v.desc || "";

});
